name: Package PrimeShow Source

on:
  push:
    paths:
      - '.github/workflows/package-primeshow-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare clean source
        run: |
          rm -rf primeshow-entertainment/node_modules
          rm -rf primeshow-entertainment/.next
          rm -rf primeshow-entertainment/out
          rm -rf primeshow-entertainment/.sites-runtime
          rm -rf primeshow-entertainment/.openai
          rm -rf primeshow-entertainment/.git
          zip -r PrimeShow-Entertainment-Latest.zip primeshow-entertainment \
            -x '*/node_modules/*' '*/.next/*' '*/out/*' '*/.sites-runtime/*' '*/.openai/*' '*/.git/*'

      - name: Upload latest source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PrimeShow-Entertainment-Latest
          path: PrimeShow-Entertainment-Latest.zip
          retention-days: 1
